services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hci_user
      POSTGRES_PASSWORD: hci_pass
      POSTGRES_DB: hci_millionaire
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "9090:8080"
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha-dark

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: .
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres_data: